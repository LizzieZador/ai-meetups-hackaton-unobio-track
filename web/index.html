<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biotech Investment Committee</title>
  <script>
    // Set the theme before the first paint. Without this the page renders in the
    // light palette first and app.js flips it a moment later, so a dark-mode
    // visitor watched every colour animate from light to dark on each load.
    // app.js's initTheme() still runs and owns the toggle; this only removes the flash.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("unobio.theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" title="Switch to dark theme" aria-label="Switch to dark theme">
    <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
      <clipPath id="tt-clip"><circle cx="20" cy="20" r="19"/></clipPath>
      <g clip-path="url(#tt-clip)">
        <rect class="tt-sky" x="0" y="0" width="40" height="23"/>
        <rect class="tt-sea" x="0" y="23" width="40" height="17"/>
        <circle class="tt-star" cx="9" cy="8" r="1"/>
        <circle class="tt-star" cx="16" cy="5" r=".8"/>
        <circle class="tt-star" cx="29" cy="9" r=".9"/>
        <circle class="tt-star" cx="33" cy="15" r=".7"/>
        <g class="tt-sun">
          <circle class="tt-sun-halo" cx="20" cy="18" r="10"/>
          <circle class="tt-sun-core" cx="20" cy="18" r="6"/>
        </g>
        <g class="tt-moon">
          <circle class="tt-moon-core" cx="20" cy="18" r="6.5"/>
          <circle class="tt-moon-cut" cx="17" cy="15.5" r="5.5"/>
        </g>
      </g>
    </svg>
  </button>
  <div id="welcome" class="welcome">
    <canvas id="helix" class="helix" aria-hidden="true"></canvas>
    <div class="welcome-inner">
      <h1 class="welcome-title">Biotech Investment Advice,<br>Powered By Data</h1>
      <p class="welcome-sub">Underwrite a drug, indication or mechanism across twelve intelligence cards.</p>
      <form id="welcome-form" class="welcome-form">
        <input id="welcome-query" type="text" autocomplete="off"
               placeholder="e.g. KRAS G12C | Non-Small Cell Lung Cancer"
               aria-label="Mechanism and indication">
        <button id="welcome-go" type="submit" disabled>Evaluate</button>
      </form>
      <p class="welcome-hint">Separate mechanism and indication with &ldquo;|&rdquo;, &ldquo;&times;&rdquo;, &ldquo;/&rdquo;, &ldquo;for&rdquo; or &ldquo;in&rdquo;.</p>
    </div>
  </div>

  <aside id="sidebar">
    <div class="side-head">
      <span>Workspace</span>
      <div class="side-head-actions">
        <button type="button" id="home-btn" title="Home" aria-label="Back to the welcome page">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.8 8.6 10 2.8l7.2 5.8"/>
            <path d="M4.5 9.9V16a1 1 0 0 0 1 1h3.1v-4.4h2.8V17h3.1a1 1 0 0 0 1-1V9.9"/>
          </svg>
        </button>
        <button id="toggle-sidebar" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor"/>
            <line x1="8" y1="3.5" x2="8" y2="16.5" stroke="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <section id="history-panel" class="sidebar-panel">
      <button type="button" class="panel-toggle" aria-expanded="true">
        <svg class="chevron" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
          <path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Searches</span>
      </button>
      <div class="panel-body">
        <input id="history-search" type="text" class="panel-filter" placeholder="Filter searches…" autocomplete="off">
        <ul id="history"></ul>
      </div>
    </section>

    <div id="sidebar-resizer" class="sidebar-resizer" title="Drag to resize"></div>

    <section id="assistant-panel" class="sidebar-panel">
      <button type="button" class="panel-toggle" aria-expanded="true">
        <svg class="chevron" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
          <path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Assistant</span>
      </button>
      <div class="panel-body">
        <div class="chat-history">
          <div class="chat-history-head">
            <span class="chat-history-title">Chat history</span>
            <button type="button" id="assistant-new-chat" class="chat-new">+ New chat</button>
          </div>
          <ul id="assistant-chats" class="chat-list"></ul>
        </div>
        <div id="assistant-log" class="assistant-log hidden" aria-live="polite"></div>
        <form id="assistant-form" class="assistant-form">
          <input id="assistant-input" type="text" autocomplete="off"
                 placeholder="Ask about this evaluation…" aria-label="Message the assistant">
          <button id="assistant-send" type="submit" disabled>Send</button>
        </form>
      </div>
    </section>
  </aside>
  <main>
    <header class="topbar">
      <form id="search" class="search-form">
        <button type="button" id="open-sidebar" class="hidden" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor"/>
            <line x1="8" y1="3.5" x2="8" y2="16.5" stroke="currentColor"/>
          </svg>
        </button>
        <div id="search-detailed" class="search-fields">
          <input id="indication" type="text" placeholder="Indication, e.g. Non-Small Cell Lung Cancer" autocomplete="off">
          <input id="mechanism" type="text" placeholder="Mechanism / Target, e.g. KRAS G12C" autocomplete="off">
        </div>
        <div id="search-quick" class="search-fields hidden">
          <input id="query" type="text" placeholder="e.g. KRAS G12C | Non-Small Cell Lung Cancer" autocomplete="off">
        </div>
        <button type="button" id="search-mode-toggle" class="mode-toggle">Quick search</button>
        <button id="evaluate" type="submit" disabled>Evaluate</button>
      </form>
    </header>
    <section id="content"><p class="empty">Search a drug, an indication or a mechanism to build an evaluation.</p></section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
